name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git lfs version
      - run: npm run build
      - run: npm run typecheck
      - name: Run Biome lint and compatibility rules
        run: npm run lint
      - name: Check Biome and fallback formatting
        run: npm run format:check
      - run: npm run notices:check
      - run: npm test
      - run: npm run package
